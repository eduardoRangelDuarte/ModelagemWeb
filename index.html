<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <div class="logo">
            <img src="img/logo.png" alt="Logo To-Do List">
        </div>

        <div class="titulo">
            <h1>Minha To-Do List</h1>
        </div>

    </header>

    <main>

        <aside class="menu">

            <h2>Menu</h2>

            <nav>
                <ul>
                    <li><a href="#inicio">Início</a></li>
                    <li><a href="#tarefas">Minhas tarefas</a></li>
                    <li><a href="#concluidas">Tarefas concluídas</a></li>
                </ul>
            </nav>

        </aside>

        <section class="conteudo">

            <section id="inicio">

                <h2>Início</h2>

                <p>
                    Bem-vindo à sua To-Do List! Organize suas tarefas de forma simples e prática.
                </p>

            </section>

            <h2 id="tarefas">Minhas tarefas</h2>

            <div class="adicionar-tarefa">

                <input
                    type="text"
                    id="entrada-tarefa"
                    placeholder="Digite uma tarefa">

                <button id="btn-adicionar">Adicionar</button>

            </div>

            <ul id="lista-tarefas">
            </ul>

            <section id="concluidas">

                <h2>Tarefas concluídas</h2>

                <ul id="lista-concluidas"></ul>

            </section>

        </section>

        <aside class="outras">

            <h2>Outras</h2>

            <p>
                Total de tarefas:
                <span id="total-tarefas">0</span>
            </p>

            <p>
                Concluídas:
                <span id="total-concluidas">0</span>
            </p>

        </aside>

    </main>

    <footer>

        <p>Minha To-Do List - 2026</p>

    </footer>

    <script src="script.js"></script>

</body>

</html>
