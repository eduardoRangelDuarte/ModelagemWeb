<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <div class="logo">
            <h2>LOGO</h2>
        </div>

        <div class="titulo">
            <h1>Minha To-Do List</h1>
        </div>

        <div class="login">
            <input type="text" placeholder="Login">
            <input type="password" placeholder="Senha">
        </div>

    </header>


    <main>

        <aside class="menu">
            <h2>Menu</h2>

            <nav>
                <ul>
                    <li>Início</li>
                    <li>Minhas tarefas</li>
                    <li>Tarefas concluídas</li>
                </ul>
            </nav>
        </aside>


        <section class="conteudo">

            <h2>Minhas tarefas</h2>

            <div class="adicionar-tarefa">

                <input
                    type="text"
                    placeholder="Digite uma tarefa">

                <button>Adicionar</button>

            </div>

            <ul>
                <li>Estudar HTML</li>
                <li>Estudar CSS</li>
                <li>Fazer atividade</li>
            </ul>

        </section>


        <aside class="outras">

            <h2>Outras</h2>

            <p>Total de tarefas: 3</p>
            <p>Concluídas: 0</p>

        </aside>

    </main>


    <footer>

        <p>Minha To-Do List - 2026</p>

    </footer>

</body>

</html>
